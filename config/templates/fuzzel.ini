# fuzzel — generated from colorscheme.py (wallpaper palette)

[main]
font=JetBrains Mono Nerd Font:size=13
terminal=alacritty
prompt=run:
prompt-char="> "
lines=12
width=50
horizontal-pad=24
vertical-pad=16
inner-pad=8
layer=overlay
anchor=top

# Behavior
dmenu=yes
match-mode=fuzzy
sort=score

# Icons
icons-enabled=yes
icon-theme=Papirus-Dark

# Colors
[colors]
background=@{bg_t}
text=@{fg}
prompt=@{accent}
input=@{fg}
placeholder=@{muted}
selection=@{surface}
selection-text=@{fg}
match=@{accent}
selection-match=@{accent}
counter=@{muted}
border=@{accent}