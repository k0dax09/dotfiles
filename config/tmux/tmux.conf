# tmux.conf — niri dotfiles
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

set -g history-limit 5000

set -g mouse on
set -g set-clipboard on

set -g prefix C-b
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Внешний вид ─────────────────────────────────────
set -g status-position top
set -g status-justify left
set -g status-bg "#1a1b26"
set -g status-fg "#c0caf5"
set -g status-left-length 40
set -g status-right-length 60

set -g status-left  " #[fg=#7aa2f7,bold]#{?client_prefix,,} #S "
set -g status-right "#[fg=#9ece6a] #H  #[fg=#c0caf5,bold]%H:%M "
set -g status-interval 5

setw -g window-status-current-style "fg=#1a1b26,bg=#7aa2f7,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-style         "fg=#8f8f9a,bg=#1a1b26"
setw -g window-status-format        " #I:#W "

setw -g pane-border-style        "fg=#3b4261"
setw -g pane-active-border-style "fg=#7aa2f7"

set -g message-style "bg=#2a2a33,fg=#c0caf5"

# ── Плавность ────────────────────────────────────────
set -g escape-time 0
set -sg repeat-time 300
