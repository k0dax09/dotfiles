# fuzzel — app launcher for wayland/niri

[main]
font=JetBrains Mono Nerd Font:size=13
terminal=alacritty
prompt=run:
prompt-char="> "
lines=12
width=50
horizontal-pad=24
vertical-pad=16
inner-pad=8
layer=overlay
anchor=top

# Behavior
dmenu=no
match-mode=fuzzy
sort=score

# Icons
icons-enabled=yes
icon-theme=Papirus-Dark

# Colors (waybar theme)
[colors]
background=24242ddd
text=e6e6eaff
prompt=7aa2f7ff
input=e6e6eaff
placeholder=8f8f9aff
selection=2a2a33ff
selection-text=e6e6eaff
match=7aa2f7ff
selection-match=7aa2f7ff
counter=8f8f9aff
border=7aa2f7ff
